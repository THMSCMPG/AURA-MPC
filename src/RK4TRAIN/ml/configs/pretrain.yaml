# PINN Pre-training Configuration
# Supervised learning on RK4TRAN synthetic data

paths:
  csv_data_dir: ../../lattice_batches/  # small/smoke-test CSVs only -- RK4TRANDataset loads these fully into RAM
  memmap_meta_path: null  # set to a build_memmap()-produced .meta.json for real-scale data (RK4TRANMemmapDataset)
  output_dir: ./outputs/pretrain
  checkpoints_dir: ./outputs/pretrain/checkpoints
  logs_dir: ./outputs/pretrain/logs

data:
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  batch_size: 64
  num_workers: 4
  seed: 42
  normalize: true

model:
  input_dim: 19  # 7 weather + 4 panel state + 3 location + 5 time -- derived at runtime from the dataset, this is just documentation
  hidden_dim: 128
  num_residual_blocks: 4
  num_outputs: 4  # T_operating, T_operating_sigma, eta, eta_sigma
  dropout: 0.1

training:
  epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 5
  checkpoint_every: 10

optimization:
  scheduler: cosine  # cosine, linear, step
  cosine_eta_min: 1.0e-6
  gradient_clip: 1.0

uncertainty:
  strategy: weighted  # weighted, augment, keep
  include_sigma: true

device: cuda  # cuda or cpu
mixed_precision: false
