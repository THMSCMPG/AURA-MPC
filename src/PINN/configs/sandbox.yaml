# PINN-AURA-MFP sandbox defaults (phase-2 RL + live demo)

model:
  checkpoint_path: ./outputs/pretrain/checkpoints/best_model.pt

physics:
  # Keep configurable; c-Si default temperature coefficient
  beta_Pmax: -0.004
  eta_ref: 0.18
  T_ref_K: 298.15

fortran:
  binary_path: ../RK4TRAN/main
  timeout_s: 30.0
  cache_size: 2000

sandbox:
  seed: 42
  dt_s: 1.0
  episode_steps: 64
  train_epochs: 40
  episodes_per_epoch: 8
  discount_gamma: 0.98
  learning_rate: 3.0e-4
  policy_hidden_dim: 128
  policy_std: 0.25
  
  # Reward function tuning (Phase 3 priorities)
  # Component 1: Irradiance Capture (efficiency & orientation)
  reward_w_capture: 1.0                 # Weight for capture component
  reward_capture_scale: 1.0e-3          # Normalize captured irradiance to [-1,1]
  
  # Component 2: Temperature Control (keep T < T_ref + margin)
  reward_w_temp: 0.4                    # Weight for temperature penalty
  reward_temp_margin_K: 0.0             # Acceptable temp above reference
  reward_temp_scale: 1.0                # Temperature penalty magnitude
  
  # Component 3: Action Smoothness (discourage jitter)
  pose_change_penalty: 1.0e-3           # L2 penalty on pose changes
  
  # Episode domain randomization
  lat_min: -65.0
  lat_max: 65.0
  lon_min: -180.0
  lon_max: 180.0
  day_min: 1
  day_max: 365
  hour_min: 5.0
  hour_max: 19.0
  ambient_c_min: -15.0
  ambient_c_max: 45.0
  wind_min: 0.0
  wind_max: 20.0
  cloud_min: 0.0
  cloud_max: 1.0
  g_peak_min: 500.0
  g_peak_max: 1100.0
  
  # Misc
  command_log_path: /var/run/aura/commands.jsonl
  z_to_height_mm_max: 130.0
  validation_samples: 16
